<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>My Baby's Birthday Quest</title>
  <meta name="description" content="A birthday adventure, one surprise at a time." />
  <meta name="theme-color" content="#f6e4e1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Chrome's "Desktop site" mode renders a ~980px page on a phone and shrinks it.
    // Scale back up so the app always fills a phone screen.
    (function () {
      var sw = screen.width, w = window.innerWidth;
      if (sw && sw < 760 && w > sw * 1.25) document.documentElement.style.zoom = (w / sw).toFixed(3);
    })();
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="floaties" id="floaties"></div></div>

  <!-- 1. Intro: envelope + letter -->
  <section id="intro" class="screen" aria-label="Birthday letter">
    <button class="envelope-btn" id="envelope" aria-label="Open the envelope">
      <img src="img/envelope.png" alt="" width="250" height="199" />
    </button>
    <div class="intro-caption" id="intro-caption">
      <h1 class="pixel-title">A letter for <span data-name></span></h1>
      <p class="muted">Tap the envelope to open it</p>
    </div>

    <article class="paper letter hidden" id="letter">
      <img class="letter-cat" src="img/cat_heart.gif" alt="" width="98" height="99" />
      <div class="typed script" id="typed" aria-live="polite"></div>
      <div class="letter-actions hidden" id="letter-actions">
        <p class="question">Ready for your birthday adventure?</p>
        <div class="buttons">
          <button class="pxbtn yes" id="yes-btn">YES</button>
          <button class="pxbtn no runaway" id="no-btn">NO</button>
        </div>
      </div>
    </article>
  </section>

  <!-- 2. The map -->
  <section id="map" class="screen hidden" aria-label="Birthday timeline">
    <header class="topbar">
      <div>
        <h1 class="pixel-title">My Baby's Birthday Quest</h1>
        <p class="muted" id="progress-text"></p>
      </div>
      <div class="topbar-actions">
        <button class="pxicon hidden" id="notify-btn" aria-label="Remind me before each surprise"></button>
        <button class="pxicon" id="sound-btn" aria-label="Sound on" aria-pressed="true"></button>
      </div>
    </header>

    <div class="next-chip" id="next-chip" role="status">
      <span class="next-label" id="next-label">Next surprise in</span>
      <span class="countdown" id="next-countdown">--:--:--</span>
    </div>

    <div class="path-wrap" id="path-wrap">
      <svg class="path-svg" id="path-svg" aria-hidden="true">
        <path id="path-bg" class="path-bg" />
        <path id="path-fg" class="path-fg" />
      </svg>
      <ol class="nodes" id="nodes"></ol>
      <img class="walker" id="walker" src="img/cat_dance.gif" alt="" width="40" height="58" />
    </div>

    <p class="footer muted">Made with love</p>
  </section>

  <!-- 3. Gift dialog -->
  <dialog id="gift-dialog" class="gift-dialog">
    <form method="dialog" class="close-row"><button class="pxicon small" id="close-btn" aria-label="Close"></button></form>
    <div id="gift-body"></div>
  </dialog>

  <!-- 4. Finale: cake -->
  <section id="finale" class="screen hidden" aria-label="Make a wish">
    <h1 class="pixel-title big">Make a wish, <span data-name></span></h1>
    <p class="muted" id="blow-hint">Blow into your phone to blow out the candles</p>
    <div class="cake" id="cake">
      <div class="candles" id="candles"></div>
      <div class="tier top"><span class="icing"></span></div>
      <div class="tier bottom"><span class="icing"></span><span class="cake-age" id="cake-age"></span></div>
      <div class="plate"></div>
      <img class="cake-cat" src="img/cat_dance.gif" alt="" width="55" height="80" />
    </div>
    <div class="buttons" id="wish-buttons">
      <button class="pxbtn yes" id="mic-btn">Use my breath</button>
      <button class="pxbtn no" id="tap-btn">Just tap</button>
    </div>
    <article class="paper letter final-letter hidden" id="final-letter">
      <div class="typed script" id="final-typed"></div>
      <p class="signature script">— <span data-from></span></p>
      <button class="pxbtn no" id="back-to-map">Back to the map</button>
    </article>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
